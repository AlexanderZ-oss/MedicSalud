# ═══════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE SEGURIDAD – MedicSalud Backend
# ───────────────────────────────────────────────────────────────────────
# ISO 27001  : A.10.1.2 – Gestión de claves criptográficas
# OWASP Top10: A02 – Cryptographic Failures
#
# ADVERTENCIA DE PRODUCCIÓN:
#   Los valores sensibles marcados con [SECRETO] NO deben estar en este
#   archivo en producción.  Usar variables de entorno o un gestor de
#   secretos (ej. HashiCorp Vault, AWS Secrets Manager).
#
#   Ejemplo de variables de entorno:
#     SECURITY_JWT_SECRET=<secreto-de-256-bits>
#     SECURITY_ENCRYPTION_KEY=<clave-de-32-chars>
# ═══════════════════════════════════════════════════════════════════════

spring.application.name=medicsalud-system

# ── Base de Datos (H2 en memoria para desarrollo) ─────────────────────
# ISO 27001 A.12.3.1 – Respaldo de información:
#   En producción usar PostgreSQL con backups automáticos.
#   La consola H2 debe desactivarse en producción.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:medicsalud;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true

# Consola H2 – solo para desarrollo local
# ISO 27001 A.9.4.1 – Deshabilitar en producción: spring.h2.console.enabled=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── JWT – Tokens de Autenticación ────────────────────────────────────
# ISO 27001 A.10.1.2 – Gestión de claves: usar al menos 256 bits de entropía
# OWASP A02 – [SECRETO] Reemplazar por variable de entorno en producción:
#   export SECURITY_JWT_SECRET=<clave-aleatoria-de-al-menos-32-chars>
#
# Parámetro ISO: security.jwt.secret
#   → Ubicación en código: JwtTokenProvider.secretKey (@Value)
#   → Uso: firma HMAC-SHA256 de tokens JWT
security.jwt.secret=${SECURITY_JWT_SECRET:medicsalud-jwt-secret-clave-segura-2024-minimo-32chars}

# Parámetro ISO: security.jwt.access-expiration-ms
#   → Ubicación en código: JwtTokenProvider.accessTokenValidity
#   → Uso: tiempo de vida del access token (1 hora = 3 600 000 ms)
security.jwt.access-expiration-ms=3600000

# Parámetro ISO: security.jwt.refresh-expiration-ms
#   → Ubicación en código: JwtTokenProvider.refreshTokenValidity
#   → Uso: tiempo de vida del refresh token (24 horas = 86 400 000 ms)
security.jwt.refresh-expiration-ms=86400000

# ── Cifrado de Datos en BD ────────────────────────────────────────────
# ISO 27001 A.10.1.1 – Algoritmo: AES-256/GCM (NIST recomendado)
# ISO 27001 A.10.1.2 – Gestión de claves: [SECRETO] Variable de entorno
# OWASP A02 – [SECRETO] Reemplazar por variable de entorno en producción:
#   export SECURITY_ENCRYPTION_KEY=<exactamente-32-caracteres>
#
# Parámetro ISO: security.encryption.key
#   → Ubicación en código: EncryptedStringConverter.secretKey (@Value)
#   → Uso: cifrado/descifrado de mfaSecret en tabla users (AES-256-GCM)
security.encryption.key=${SECURITY_ENCRYPTION_KEY:medicsalud-enc-key-32chars-2024!!}

# Correos que pueden iniciar sesión como ROLE_ADMIN. Separados por comas.
security.admin.allowed-emails=${SECURITY_ADMIN_ALLOWED_EMAILS:admin@medicsalud.local}

# ── Servidor ──────────────────────────────────────────────────────────
server.port=8080
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# SMS: console for local development, twilio for production
sms.provider=${SMS_PROVIDER:console}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ISO 27001 A.14.1.2 – En producción configurar HTTPS:
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
